<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cart</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html">E‑Store</a>
    <nav class="nav">
      <a href="./orders.html">My Orders</a>
      <a href="./cart.html">Cart <span id="cartBadge" class="badge">0</span></a>
      <a href="./login.html" id="loginLink">Login</a>
      <a href="./register.html" id="registerLink">Register</a>
      <button class="linklike" id="logoutBtn" style="display:none;">Logout</button>
    </nav>
  </header>

  <main class="container">
    <h1>Your Cart</h1>
    <p class="muted small">Cart is stored on the backend per user (login required).</p>

    <div id="cartList"></div>

    <div class="card">
      <div class="row">
        <strong>Total</strong>
        <strong id="cartTotal">$0.00</strong>
      </div>
      <div class="row" style="margin-top:10px;">
        <a class="btn" href="./index.html">Continue Shopping</a>
        <a class="btn primary" href="./checkout.html">Checkout</a>
      </div>
      <p id="msg" class="muted small"></p>
    </div>
  </main>

  <script type="module" src="./js/cart.page.js"></script>
</body>
</html>
